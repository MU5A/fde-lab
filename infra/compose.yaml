# Local stand-ins for the customer's systems. Everything here holds only synthetic data, and the
# credentials below are for throwaway local containers.
#
#   keycloak  stands in for the customer's Okta or Azure AD
#   postgres  the application database, with row-level security
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fdelab
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fdelab"]
      interval: 2s
      timeout: 3s
      retries: 30
